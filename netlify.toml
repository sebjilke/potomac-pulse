# Netlify Configuration for Potomac Basin Forecaster

[build]
  # Vite builds to dist/
  publish = "dist"

  # Functions directory
  functions = "netlify/functions"

  # Install dependencies and build
  command = "npm install && npm run build"

[functions]
  # Use Node.js 18 for serverless functions
  node_bundler = "esbuild"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self' https://waterservices.usgs.gov https://api.water.noaa.gov https://*.supabase.co https://potomacpulse.goatcounter.com https://corsproxy.io https://api.allorigins.win https://*.ingest.sentry.io; frame-ancestors 'none'"

# Redirect API calls to serverless function
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync-learning"
  status = 200

# Scheduled function for background learning
# Runs every 2 hours to fetch data, validate predictions, and update corrections
[functions."scheduled-update"]
  schedule = "0 */2 * * *"
